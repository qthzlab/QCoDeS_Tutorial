# Measurement configuration file for QCoDeS Tutorial.ipynb

database: C:\Data\20260911\tutorial.db
export_dir: C:\Data\20260911\exports

experiment_name: QCoDeS_Tutorial
sample_name: demo_sample

instruments:
    lockin:
        address: GPIB0::4::INSTR
        settings:
            frequency: 17.777       # Hz
